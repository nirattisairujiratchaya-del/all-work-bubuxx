<style>
  :root{
    --sidebar-a:#FCE7F0; --sidebar-b:#F8D7E6; --sidebar-hover:#F9D5E5; --sidebar-active:#F4B4D0;
    --bg:#FFFBFD; --card:#FFFFFF; --card-head:#FFF0F5; --border:#FBCFE8; --border-soft:#FDE8F4;
    --text:#4A3B43; --muted:#8A7580; --accent:#EC4899; --accent-soft:#F472B6;
    --tag-bg:#FDF2F7; --tag-text:#DB2777; --danger:#E11D48;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Kanit','Fredoka',-apple-system,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased;}
  #app{min-height:100vh;}
  .center-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .box{background:var(--card); border:1.5px solid var(--border-soft); border-radius:24px; padding:30px; width:100%; max-width:400px; box-shadow:0 10px 25px -5px rgba(244,180,208,.3);}
  .box h1{font-family:'Fredoka','Kanit',sans-serif; font-size:21px; margin:0 0 4px;}
  .box p{color:var(--muted); font-size:13px; margin:0 0 20px; line-height:1.6;}
  .brand{text-align:center; margin-bottom:10px;}
  .catimg{width:100%; height:100%; object-fit:contain; display:block;}
  .catimg.big{width:110px; height:100px; margin:0 auto; filter:drop-shadow(0 4px 8px rgba(120,100,130,.25));}
  input, textarea, select{
    width:100%; background:var(--card-head); border:1.5px solid var(--border); color:var(--text);
    border-radius:14px; padding:10px 14px; font-size:14px; margin-bottom:10px; font-family:inherit;
  }
  textarea{resize:vertical; min-height:64px;}
  input:focus, textarea:focus, select:focus{outline:none; border-color:var(--accent-soft); background:#fff; box-shadow:0 0 12px rgba(244,114,182,.25);}
  input::placeholder, textarea::placeholder{color:#C9A9B8;}
  button{cursor:pointer; border:none; border-radius:14px; padding:10px 16px; font-size:14px; font-weight:600; font-family:inherit; background:var(--accent-soft); color:#fff; transition:all .15s;}
  button:hover{background:var(--accent);}
  button.secondary{background:#fff; color:var(--tag-text); border:1.5px solid var(--border);}
  button.secondary:hover{background:var(--card-head);}
  button.ghost{background:transparent; color:var(--tag-text); font-weight:500; padding:6px 10px;}
  button.ghost:hover{background:var(--sidebar-hover);}
  button.small{padding:6px 12px; font-size:12.5px;}
  .full{width:100%;}
  .remember{display:flex; align-items:center; font-size:12.5px; color:var(--muted); margin:2px 0 12px; cursor:pointer;}
  .remember input{width:auto; margin:0 8px 0 0;}
  .err{color:var(--danger); font-size:13px; margin:-4px 0 12px; min-height:16px;}
  .muted{color:var(--muted);}

  .sidebar{width:256px; flex-shrink:0; background:linear-gradient(180deg,var(--sidebar-a),var(--sidebar-b)); border-right:1px solid var(--border); padding:16px; display:flex; flex-direction:column; justify-content:space-between; position:sticky; top:0; height:100vh;}
  .logo{display:flex; align-items:center; gap:12px; padding:12px; margin-bottom:14px; border-bottom:1px solid rgba(251,207,232,.7);}
  .logo-icon{width:52px; height:48px; flex-shrink:0; filter:drop-shadow(0 3px 5px rgba(120,100,130,.25));}

  .main{flex:1; min-width:0; padding:32px 40px 80px;}

  .cfoot{display:flex; justify-content:space-around; padding:8px; margin-top:10px; background:var(--bg); border-top:1px solid var(--border-soft);}
  .cfoot button, .cfoot a{background:transparent; color:var(--tag-text); font-size:12.5px; font-weight:500; padding:6px 10px; border-radius:12px; text-decoration:none; font-family:inherit; cursor:pointer;}

  .editcard{padding:14px; background:#fff; border:1.5px solid var(--border); border-radius:20px;}
  .editcard .acts{display:flex; gap:8px;}
  .group-header{grid-column:1/-1; font-family:'Fredoka','Kanit',sans-serif; font-size:14px; font-weight:600; color:var(--tag-text); margin-top:8px; display:flex; align-items:center; gap:8px;}
  .group-header:first-child{margin-top:0;}
  .group-header .chip{font-weight:500;}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:30px 0; grid-column:1/-1;}
  .addcard{margin-top:26px; background:#fff; border:1.5px dashed var(--border); border-radius:20px; padding:18px; max-width:520px;}
  .addcard h3{font-family:'Fredoka','Kanit',sans-serif; font-size:15px; margin:0 0 12px; color:var(--tag-text);}
  .subtabs{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
  .subtab-btn{background:#fff; color:var(--muted); border:1.5px solid var(--border); border-radius:999px; padding:6px 16px; font-size:13px; font-weight:500;}
  .subtab-btn:hover{background:var(--card-head);}
  .subtab-btn.active{background:var(--accent-soft); color:#fff; border-color:var(--accent-soft);}
  .tag{display:inline-block; font-size:10.5px; font-weight:600; padding:1px 8px; border-radius:999px; margin-left:6px; vertical-align:middle;}
  .tag-cabal{background:#F3E8FF; color:#9333EA;}
  .tag-hof{background:#E0F2FE; color:#0369A1;}
  .import-card{max-width:560px; background:#fff; border:1.5px solid var(--border-soft); border-radius:20px; padding:22px; box-shadow:0 10px 25px -5px rgba(244,180,208,.2);}
  .import-card textarea{min-height:140px;}
  .toast{position:fixed; bottom:22px; right:22px; background:#fff; border:2px solid var(--border); color:var(--text); padding:12px 20px; border-radius:18px; font-size:13.5px; box-shadow:0 10px 25px rgba(244,180,208,.4); opacity:0; transform:translateY(10px); transition:all .25s; pointer-events:none; z-index:50;}
  .toast.show{opacity:1; transform:none;}
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:999px;}

  @media (max-width:800px){
    .shell{flex-direction:column;}
    .sidebar{width:100%; height:auto; position:static; flex-direction:column; gap:10px; padding:12px;}
    .logo{padding:6px 8px; margin-bottom:4px;}
    .nav{flex-direction:row; overflow-x:auto; padding-bottom:4px;}
    .nav button{width:auto; white-space:nowrap; padding:10px 14px;}
    .side-bottom{border-top:none; padding-top:0;}
    .main{padding:20px 16px 80px;}
    .head h1{font-size:24px;}
    .head input{width:100%;}
    .grid, .grid.wide{grid-template-columns:1fr;}
  }
</style>

// ---------- crypto helpers ----------
function bufToBase64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function base64ToBuf(b64){ const bin = atob(b64); const arr = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i); return arr.buffer; }

async function deriveKey(password, saltBuf){
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), {name:"PBKDF2"}, false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt: saltBuf, iterations: 250000, hash:"SHA-256"},
    keyMaterial,
    {name:"AES-GCM", length:256},
    true,
    ["encrypt","decrypt"]
  );
}

async function encryptData(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder();
  const data = enc.encode(JSON.stringify(obj));
  const cipherBuf = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, data);
  const combined = new Uint8Array(iv.length + cipherBuf.byteLength);
  combined.set(iv, 0);
  combined.set(new Uint8Array(cipherBuf), iv.length);
  return bufToBase64(combined.buffer);
}

async function decryptData(key, b64){
  const combined = new Uint8Array(base64ToBuf(b64));
  const iv = combined.slice(0,12);
  const cipherBuf = combined.slice(12);
  const plainBuf = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, cipherBuf);
  const dec = new TextDecoder();
  return JSON.parse(dec.decode(plainBuf));
}

function escapeHtml(str){
  return String(str ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove("show"), 1800);
}

function copyText(text, okMsg){
  navigator.clipboard.writeText(text).then(()=>toast(okMsg || "คัดลอกแล้ว 🌸"));
}

function coverClass(key){
  let h = 0;
  for(const c of String(key||"")) h = (h*31 + c.charCodeAt(0)) >>> 0;
  return "cv" + (h % 6);
}

function hostOf(url){
  try{ return new URL(url).hostname; }catch(e){ return url; }
}

// ---------- remember unlock for this tab (cleared when tab closes) ----------
async function rememberKey(key){
  try{ sessionStorage.setItem("vk", JSON.stringify(await crypto.subtle.exportKey("jwk", key))); }catch(e){}
}
function forgetKey(){ try{ sessionStorage.removeItem("vk"); }catch(e){} }

// ---------- data persistence ----------
async function saveState(){
  try{
    const enc = await encryptData(cryptoKey, vaultData);
    const { error } = await client.from("personal_vault").update({encrypted_data: enc, updated_at: new Date().toISOString()}).eq("id", ROW_ID);

  }catch(e){
    console.error(e);
    toast("บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง");
  }
}

        <h1>ตั้งรหัสผ่านหลัก</h1>
        <p>ยังไม่มีข้อมูล — ตั้งรหัสผ่านหลักเพื่อเริ่มสร้างพื้นที่ All Work BuBuX ของคุณ ข้อมูลทั้งหมดจะถูกเข้ารหัสในเครื่องก่อนส่งขึ้นเซิร์ฟเวอร์เสมอ (ลืมรหัสนี้แล้วกู้คืนข้อมูลไม่ได้ โปรดจำให้ดี)</p>
        <input type="password" id="pw1" placeholder="รหัสผ่านหลัก (อย่างน้อย 8 ตัวอักษร)" autocomplete="new-password" />
        <input type="password" id="pw2" placeholder="ยืนยันรหัสผ่านหลัก" autocomplete="new-password" />
        <textarea id="setupImport" placeholder="(ไม่บังคับ) วางข้อมูล JSON ที่ได้รับมาตรงนี้ เพื่อนำเข้าตอนสร้างเลยก็ได้"></textarea>
        <div class="err" id="setupErr"></div>
        <button class="full" id="setupBtn">สร้างพื้นที่ของฉัน</button>
      </div>
    </div>
  `;
  document.getElementById("setupBtn").onclick = async () => {
    const pw1 = document.getElementById("pw1").value;
    const pw2 = document.getElementById("pw2").value;
    const errEl = document.getElementById("setupErr");
    if(pw1.length < 8){ errEl.textContent = "รหัสผ่านต้องยาวอย่างน้อย 8 ตัวอักษร"; return; }
    if(pw1 !== pw2){ errEl.textContent = "รหัสผ่านไม่ตรงกัน"; return; }
    errEl.textContent = "";
    vaultData = JSON.parse(JSON.stringify(DEFAULT_DATA));
    const impRaw = document.getElementById("setupImport").value.trim();
    if(impRaw){
      try{
        const obj = JSON.parse(impRaw);
        if(Array.isArray(obj.links)) vaultData.links.push(...obj.links);
        if(Array.isArray(obj.passwords)) vaultData.passwords.push(...obj.passwords);
        if(Array.isArray(obj.patterns)) vaultData.patterns.push(...obj.patterns);
      }catch(e){ errEl.textContent = "รูปแบบข้อมูลนำเข้าไม่ถูกต้อง (JSON)"; return; }
    }
    const saltBuf = crypto.getRandomValues(new Uint8Array(16)).buffer;
    saltB64 = bufToBase64(saltBuf);
    cryptoKey = await deriveKey(pw1, saltBuf);
    const enc = await encryptData(cryptoKey, vaultData);
    const { error } = await client.from("personal_vault").insert({id: ROW_ID, salt: saltB64, encrypted_data: enc});
    if(error){ errEl.textContent = "สร้างไม่สำเร็จ: " + error.message; return; }
    renderDashboard();
  };
}

function renderUnlockScreen(encryptedData){
  app.innerHTML = `

        <h1>ใส่รหัสผ่านหลัก</h1>
        <p>ปลดล็อก All Work BuBuX ของคุณ</p>
        <input type="password" id="pw" placeholder="รหัสผ่านหลัก" autocomplete="off" autofocus />
        <label class="remember"><input type="checkbox" id="remember" /> จำไว้ในแท็บนี้ (รีเฟรชไม่ต้องใส่ใหม่ ปิดแท็บแล้วหาย)</label>
        <div class="err" id="unlockErr"></div>
        <button class="full" id="unlockBtn">ปลดล็อก</button>
      </div>
    </div>
  `;
  const doUnlock = async () => {
    const pw = document.getElementById("pw").value;
    const errEl = document.getElementById("unlockErr");
    try{
      const saltBuf = base64ToBuf(saltB64);
      const key = await deriveKey(pw, saltBuf);
      const data = await decryptData(key, encryptedData);
      cryptoKey = key;
      vaultData = data;
      if(document.getElementById("remember").checked) await rememberKey(key);
      renderDashboard();
    }catch(e){
      errEl.textContent = "รหัสผ่านไม่ถูกต้อง";
    }
  };
  document.getElementById("unlockBtn").onclick = doUnlock;
  document.getElementById("pw").addEventListener("keydown", e => { if(e.key === "Enter") doUnlock(); });
}

function lock(){
  forgetKey();
  cryptoKey = null;
  vaultData = null;
  showPw = {};
  editIndex = { links: -1, passwords: -1, patterns: -1 };
  activeTab = "links";
  patternFilter = "all";
  init();
}

// ---------- pattern game auto-tagging ----------
function inferPatternGame(text){
  const hofCount = ((text||"").match(/ครับ/g) || []).length;
  const cabalCount = ((text||"").match(/ค่ะ|คะ/g) || []).length;
  if(hofCount === 0 && cabalCount === 0) return null;
  return hofCount >= cabalCount ? "hof" : "cabal";
}
function migratePatternGames(){
  let changed = false;
  vaultData.patterns.forEach(p => {
    if(!p.game){
      const g = inferPatternGame(p.text);
      if(g){ p.game = g; changed = true; }
    }
  });
  return changed;
}

async function changePassword(){
  const cur = prompt("ใส่รหัสผ่านหลักปัจจุบันเพื่อยืนยัน:");
  if(cur === null) return;
  try{
    const curKey = await deriveKey(cur, base64ToBuf(saltB64));
    await decryptData(curKey, await encryptData(cryptoKey, vaultData));
  }catch(e){}
  const p1 = prompt("รหัสผ่านหลักใหม่ (อย่างน้อย 8 ตัวอักษร):");
  if(!p1 || p1.length < 8){ toast("ยกเลิก: รหัสผ่านสั้นเกินไป"); return; }
  const p2 = prompt("ยืนยันรหัสผ่านหลักใหม่:");
  if(p1 !== p2){ toast("รหัสผ่านไม่ตรงกัน"); return; }
  const newSaltBuf = crypto.getRandomValues(new Uint8Array(16)).buffer;
  const newSaltB64 = bufToBase64(newSaltBuf);
  const newKey = await deriveKey(p1, newSaltBuf);
  const enc = await encryptData(newKey, vaultData);
  const { error } = await client.from("personal_vault").update({salt: newSaltB64, encrypted_data: enc, updated_at: new Date().toISOString()}).eq("id", ROW_ID);
  if(error){ toast("เปลี่ยนรหัสไม่สำเร็จ"); return; }
  saltB64 = newSaltB64;
  cryptoKey = newKey;
  if(sessionStorage.getItem("vk")) await rememberKey(newKey);
  toast("เปลี่ยนรหัสผ่านหลักแล้ว");
}

// ---------- dashboard ----------
function matches(text){
  if(!searchQuery) return true;
  return String(text || "").toLowerCase().includes(searchQuery.toLowerCase());
}

function renderDashboard(){
  app.innerHTML = `
    <div class="shell">

    b.onclick = () => { activeTab = b.dataset.tab; applyActiveTab(); };

}

function applyActiveTab(){
  const map = { import:"sec-import", links:"sec-links", passwords:"sec-passwords", patterns:"sec-patterns" };
  Object.entries(map).forEach(([tab, id]) => {
    const el = document.getElementById(id);
    if(el) el.style.display = (tab === activeTab) ? "block" : "none";
  });
  document.querySelectorAll(".tab-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.tab === activeTab);
  });
  const t = document.getElementById("page-title");
  if(t) t.textContent = TAB_TITLES[activeTab] || "";
}

function renderSections(){
  renderImport();
  renderLinks();
  renderPasswords();
  renderPatterns();
}

function updateSidebarCounts(){
  const set = (tab, text) => { const b = document.querySelector(`.tab-btn[data-tab="${tab}"]`); if(b) b.textContent = text; };
  set("links", `🔗 ลิงก์ & เครื่องมือ (${vaultData.links.length})`);
  set("passwords", `🔑 รหัสผ่าน (${vaultData.passwords.length})`);
  set("patterns", `⌨️ แพทเทิร์นการพิมพ์ (${vaultData.patterns.length})`);
  set("import", `📥 นำเข้าข้อมูล`);
}

// ----- Import (paste JSON) -----
function renderImport(){
  const el = document.getElementById("sec-import");
  if(!el) return;
  el.innerHTML = `
    <div class="import-card">
      <h3 style="margin:0 0 6px;font-family:'Fredoka','Kanit',sans-serif;">☁️ นำเข้าข้อมูลสำรอง</h3>
      <p class="muted" style="font-size:12.5px;margin:0 0 14px;">วางข้อความ JSON เพื่อเพิ่มข้อมูลเข้าระบบ (ไม่ลบของเดิม)</p>
      <textarea id="imp-text" placeholder='{"links":[...],"passwords":[...],"patterns":[...]}'></textarea>
      <button class="full" id="imp-btn">นำเข้าข้อมูล</button>
    </div>
  `;
  document.getElementById("imp-btn").onclick = () => {
    const raw = document.getElementById("imp-text").value.trim();
    if(!raw){ toast("วางข้อมูลก่อน"); return; }
    try{
      const obj = JSON.parse(raw);
      let count = 0;
      if(Array.isArray(obj.links)){ vaultData.links.push(...obj.links); count += obj.links.length; }
      if(Array.isArray(obj.passwords)){ vaultData.passwords.push(...obj.passwords); count += obj.passwords.length; }
      if(Array.isArray(obj.patterns)){ vaultData.patterns.push(...obj.patterns); count += obj.patterns.length; }
      migratePatternGames();
      saveState();
      renderLinks(); renderPasswords(); renderPatterns();
      document.getElementById("imp-text").value = "";
      toast(`นำเข้าแล้ว ${count} รายการ`);
    }catch(e){
      toast("รูปแบบ JSON ไม่ถูกต้อง");
    }
  };
}

// ----- Links & Tools -----
function renderLinks(){
  const el = document.getElementById("sec-links");
  const items = vaultData.links.map((it, i) => ({...it, _i:i})).filter(it => matches(it.title) || matches(it.url) || matches(it.note));
  el.innerHTML = `
    <p class="count-line">ทั้งหมด ${vaultData.links.length} รายการ</p>
    <div class="grid">
      ${items.length ? items.map(renderLinkItem).join("") : `<div class="empty">ไม่พบรายการ</div>`}
    </div>
    <div class="addcard">
      <h3>+ เพิ่มลิงก์ใหม่</h3>
      <input id="l-title" placeholder="ชื่อ" />
      <input id="l-url" placeholder="URL" />
      <input id="l-note" placeholder="โน้ต (ไม่บังคับ)" />
      <button class="full" id="l-add">+ เพิ่มลิงก์</button>
    </div>
  `;
  items.forEach(it => {
    if(editIndex.links === it._i){
      document.getElementById(`l-save-${it._i}`).onclick = () => {
        const t = document.getElementById(`le-title-${it._i}`).value.trim();
        const u = document.getElementById(`le-url-${it._i}`).value.trim();
        const n = document.getElementById(`le-note-${it._i}`).value.trim();
        if(!t || !u){ toast("กรอกชื่อและ URL ก่อน"); return; }
        vaultData.links[it._i] = {title:t, url:u, note:n};
        editIndex.links = -1;
        saveState(); renderLinks();
      };
      document.getElementById(`l-cancel-${it._i}`).onclick = () => {
        editIndex.links = -1; renderLinks();
      };
    }else{
      document.getElementById(`l-copy-${it._i}`).onclick = () => copyText(it.url, "คัดลอกลิงก์แล้ว 🌸");
      document.getElementById(`l-del-${it._i}`).onclick = () => {
        if(!confirm("ลบรายการนี้?")) return;
        vaultData.links.splice(it._i,1); saveState(); renderLinks();
      };
      document.getElementById(`l-edit-${it._i}`).onclick = () => {
        editIndex.links = it._i; renderLinks();
      };
    }
  });
  document.getElementById("l-add").onclick = () => {
    const title = document.getElementById("l-title").value.trim();
    const url = document.getElementById("l-url").value.trim();
    const note = document.getElementById("l-note").value.trim();
    if(!title || !url){ toast("กรอกชื่อและ URL ก่อน"); return; }
    vaultData.links.push({title, url, note});
    saveState(); renderLinks();
  };
  updateSidebarCounts();
}
function renderLinkItem(it){
  if(editIndex.links === it._i){
    return `
      <div class="editcard">
        <input id="le-title-${it._i}" value="${escapeHtml(it.title)}" placeholder="ชื่อ" />
        <input id="le-url-${it._i}" value="${escapeHtml(it.url)}" placeholder="URL" />
        <textarea id="le-note-${it._i}" placeholder="โน้ต (ไม่บังคับ)">${escapeHtml(it.note||"")}</textarea>
        <div class="acts">
          <button class="small" id="l-save-${it._i}">บันทึก</button>
          <button class="ghost small" id="l-cancel-${it._i}">ยกเลิก</button>
        </div>
      </div>
    `;
  }
  return `
    <div class="canvas-card">
      <div>
        <div class="cover ${coverClass(it.title)}"><span>🔗</span><span class="chip">${escapeHtml(hostOf(it.url))}</span></div>
        <div class="cbody">
          <div class="ctitle"><a href="${escapeHtml(it.url)}" target="_blank" rel="noopener">${escapeHtml(it.title)}</a></div>
          ${it.note ? `<div class="csub">${escapeHtml(it.note)}</div>` : ""}
        </div>
      </div>
      <div class="cfoot">
        <a href="${escapeHtml(it.url)}" target="_blank" rel="noopener">เปิด ↗</a>
        <button id="l-copy-${it._i}">คัดลอก</button>
        <button id="l-edit-${it._i}">แก้ไข</button>
        <button id="l-del-${it._i}">ลบ</button>
      </div>
    </div>
  `;
}

// ----- Passwords -----
function renderPasswords(){
  const el = document.getElementById("sec-passwords");
  const items = vaultData.passwords.map((it, i) => ({...it, _i:i})).filter(it => matches(it.site) || matches(it.username) || matches(it.note));
  const groups = [];
  const groupMap = {};
  items.forEach(it => {
    const key = ((it.site||"").replace(/\s+\d+$/, "").trim()) || it.site || "";
    if(!groupMap[key]){ groupMap[key] = { key, items: [] }; groups.push(groupMap[key]); }
    groupMap[key].items.push(it);
  });
  el.innerHTML = `
    <p class="count-line">ทั้งหมด ${vaultData.passwords.length} รายการ</p>
    <div class="grid">
      ${groups.length ? groups.map(renderPwGroup).join("") : `<div class="empty">ไม่พบรายการ</div>`}
    </div>
    <div class="addcard">
      <h3>+ เพิ่มรหัสผ่านใหม่</h3>
      <input id="p-site" placeholder="เว็บไซต์ / ระบบ" autocomplete="off" />
      <input id="p-user" placeholder="ชื่อผู้ใช้ / อีเมล" autocomplete="off" />
      <input id="p-pass" placeholder="รหัสผ่าน" autocomplete="off" />
      <input id="p-note" placeholder="โน้ต (ไม่บังคับ)" />
      <button class="full" id="p-add">+ เพิ่มรหัสผ่าน</button>
    </div>
  `;
  items.forEach(it => {
    if(editIndex.passwords === it._i){
      document.getElementById(`p-save-${it._i}`).onclick = () => {
        const s = document.getElementById(`pe-site-${it._i}`).value.trim();
        const u = document.getElementById(`pe-user-${it._i}`).value.trim();
        const pw = document.getElementById(`pe-pass-${it._i}`).value;
        const n = document.getElementById(`pe-note-${it._i}`).value.trim();
        if(!s || !pw){ toast("กรอกเว็บไซต์และรหัสผ่านก่อน"); return; }
        vaultData.passwords[it._i] = {site:s, username:u, password:pw, note:n};
        editIndex.passwords = -1;
        saveState(); renderPasswords();
      };
      document.getElementById(`p-cancel-${it._i}`).onclick = () => {
        editIndex.passwords = -1; renderPasswords();
      };
    }else{
      document.getElementById(`p-toggle-${it._i}`).onclick = () => {
        showPw[it._i] = !showPw[it._i]; renderPasswords();
      };
      document.getElementById(`p-copy-${it._i}`).onclick = () => copyText(it.password, "คัดลอกรหัสผ่านแล้ว 🌸");
      document.getElementById(`p-copyuser-${it._i}`).onclick = () => copyText(it.username || it.site, "คัดลอกชื่อผู้ใช้แล้ว 🌸");
      document.getElementById(`p-del-${it._i}`).onclick = () => {
        if(!confirm("ลบรายการนี้?")) return;
        vaultData.passwords.splice(it._i,1); saveState(); renderPasswords();
      };
      document.getElementById(`p-edit-${it._i}`).onclick = () => {
        editIndex.passwords = it._i; renderPasswords();
      };
    }
  });
  document.getElementById("p-add").onclick = () => {
    const site = document.getElementById("p-site").value.trim();
    const username = document.getElementById("p-user").value.trim();
    const password = document.getElementById("p-pass").value;
    const note = document.getElementById("p-note").value.trim();
    if(!site || !password){ toast("กรอกเว็บไซต์และรหัสผ่านก่อน"); return; }
    vaultData.passwords.push({site, username, password, note});
    saveState(); renderPasswords();
  };
  updateSidebarCounts();
}
function renderPwGroup(group){
  const header = group.items.length > 1 ? `<div class="group-header">${escapeHtml(group.key)} <span class="chip">${group.items.length} บัญชี</span></div>` : "";
  return header + group.items.map(renderPwItem).join("");
}
function renderPwItem(it){
  if(editIndex.passwords === it._i){
    return `
      <div class="editcard">
        <input id="pe-site-${it._i}" value="${escapeHtml(it.site)}" placeholder="เว็บไซต์ / ระบบ" autocomplete="off" />
        <input id="pe-user-${it._i}" value="${escapeHtml(it.username||"")}" placeholder="ชื่อผู้ใช้ / อีเมล" autocomplete="off" />
        <input id="pe-pass-${it._i}" value="${escapeHtml(it.password||"")}" placeholder="รหัสผ่าน" autocomplete="off" />
        <textarea id="pe-note-${it._i}" placeholder="โน้ต (ไม่บังคับ)">${escapeHtml(it.note||"")}</textarea>
        <div class="acts">
          <button class="small" id="p-save-${it._i}">บันทึก</button>
          <button class="ghost small" id="p-cancel-${it._i}">ยกเลิก</button>
        </div>
      </div>
    `;
  }
  const visible = !!showPw[it._i];
  const key = ((it.site||"").replace(/\s+\d+$/, "").trim()) || it.site || "";
  return `
    <div class="canvas-card">
      <div>
        <div class="cover ${coverClass(key)}"><span>🔑</span><span class="chip">${escapeHtml(key)}</span></div>
        <div class="cbody">
          <div class="ctitle">${escapeHtml(it.site)}</div>
          <div class="cred">
            <div><span>User</span><span class="v">${escapeHtml(it.username || "-")}</span></div>
            <div><span>Pass</span><span class="v pv">${visible ? escapeHtml(it.password) : "••••••••••"}</span></div>
          </div>
          ${it.note ? `<div class="csub" style="margin-top:8px;">${escapeHtml(it.note)}</div>` : ""}
        </div>
      </div>
      <div class="cfoot">
        <button id="p-toggle-${it._i}" title="แสดง/ซ่อน">${visible ? "🙈" : "👁️"}</button>
        <button id="p-copy-${it._i}" title="คัดลอกรหัสผ่าน">📋 รหัส</button>
        <button id="p-copyuser-${it._i}" title="คัดลอกชื่อผู้ใช้">👤</button>
        <button id="p-edit-${it._i}" title="แก้ไข">✏️</button>
        <button id="p-del-${it._i}" title="ลบ">🗑️</button>
      </div>
    </div>
  `;
}

// ----- Typing patterns -----
function renderPatterns(){
  const el = document.getElementById("sec-patterns");
  const items = vaultData.patterns.map((it, i) => ({...it, _i:i})).filter(it => matches(it.title) || matches(it.text));
  const shown = items.filter(it => patternFilter === "all" ? true : it.game === patternFilter);
  el.innerHTML = `
    <div class="subtabs">
      <button class="subtab-btn ${patternFilter==='all'?'active':''}" data-filter="all">ทั้งหมด</button>
      <button class="subtab-btn ${patternFilter==='cabal'?'active':''}" data-filter="cabal">Cabal</button>
      <button class="subtab-btn ${patternFilter==='hof'?'active':''}" data-filter="hof">HOF</button>
    </div>
    <div class="grid wide">
      ${shown.length ? shown.map(renderPatternItem).join("") : `<div class="empty">ไม่พบรายการ</div>`}
    </div>
    <div class="addcard">
      <h3>+ เพิ่มแพทเทิร์นใหม่</h3>
      <input id="t-title" placeholder="ชื่อ / หัวข้อ" />
      <textarea id="t-text" placeholder="ข้อความ" style="min-height:110px;"></textarea>
      <select id="t-game">
        <option value="">ไม่ระบุเกม</option>
        <option value="cabal">Cabal</option>
        <option value="hof">HOF</option>
      </select>
      <button class="full" id="t-add">+ เพิ่มแพทเทิร์น</button>
    </div>
  `;
  el.querySelectorAll(".subtab-btn").forEach(b => {
    b.onclick = () => { patternFilter = b.dataset.filter; renderPatterns(); };
  });
  shown.forEach(it => {
    if(editIndex.patterns === it._i){
      document.getElementById(`t-save-${it._i}`).onclick = () => {
        const t = document.getElementById(`te-title-${it._i}`).value.trim();
        const x = document.getElementById(`te-text-${it._i}`).value.trim();
        const g = document.getElementById(`te-game-${it._i}`).value || null;
        if(!t || !x){ toast("กรอกชื่อและข้อความก่อน"); return; }
        vaultData.patterns[it._i] = {title:t, text:x, game:g};
        editIndex.patterns = -1;
        saveState(); renderPatterns();
      };
      document.getElementById(`t-cancel-${it._i}`).onclick = () => {
        editIndex.patterns = -1; renderPatterns();
      };
    }else{
      document.getElementById(`t-copy-${it._i}`).onclick = () => copyText(it.text, "คัดลอกข้อความแล้ว 🌸");
      document.getElementById(`t-del-${it._i}`).onclick = () => {
        if(!confirm("ลบรายการนี้?")) return;
        vaultData.patterns.splice(it._i,1); saveState(); renderPatterns();
      };
      document.getElementById(`t-edit-${it._i}`).onclick = () => {
        editIndex.patterns = it._i; renderPatterns();
      };
    }
  });
  document.getElementById("t-add").onclick = () => {
    const title = document.getElementById("t-title").value.trim();
    const text = document.getElementById("t-text").value.trim();
    const game = document.getElementById("t-game").value || null;
    if(!title || !text){ toast("กรอกชื่อและข้อความก่อน"); return; }
    vaultData.patterns.push({title, text, game});
    saveState(); renderPatterns();
  };
  updateSidebarCounts();
}
function renderPatternItem(it){
  if(editIndex.patterns === it._i){
    return `
      <div class="editcard">
        <input id="te-title-${it._i}" value="${escapeHtml(it.title)}" placeholder="ชื่อ / หัวข้อ" />
        <textarea id="te-text-${it._i}" style="min-height:150px;" placeholder="ข้อความ">${escapeHtml(it.text)}</textarea>
        <select id="te-game-${it._i}">
          <option value="" ${!it.game ? "selected" : ""}>ไม่ระบุเกม</option>
          <option value="cabal" ${it.game==='cabal' ? "selected" : ""}>Cabal</option>
          <option value="hof" ${it.game==='hof' ? "selected" : ""}>HOF</option>
        </select>
        <div class="acts">
          <button class="small" id="t-save-${it._i}">บันทึก</button>
          <button class="ghost small" id="t-cancel-${it._i}">ยกเลิก</button>
        </div>
      </div>
    `;
  }
  const tag = it.game === "cabal" ? `<span class="tag tag-cabal">Cabal</span>` : it.game === "hof" ? `<span class="tag tag-hof">HOF</span>` : "";
  return `
    <div class="canvas-card">
      <div class="cbody" style="padding-top:16px;">
        <div class="ctitle">${escapeHtml(it.title)}${tag}</div>
        <div class="ptext">${escapeHtml(it.text)}</div>
      </div>
      <div class="cfoot">
        <button id="t-copy-${it._i}">📋 คัดลอก</button>
        <button id="t-edit-${it._i}">✏️ แก้ไข</button>
        <button id="t-del-${it._i}">🗑️ ลบ</button>
      </div>
    </div>
  `;
}

init();
</script>
</body>
</html>
